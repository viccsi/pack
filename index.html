<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pack de Potes</title>
<style>
:root{
  --bg:#0f1220; --panel:#1a1e33; --text:#f2f2f7; --sub:#9a9fc2;
  --commune:#7d8597; --rare:#3aa0ff; --epique:#b23aff; --legendaire:#ffb23a;
  padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#f3f4fb; --panel:#ffffff; --text:#1a1e33; --sub:#5c6080; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
header{padding:24px 16px 8px;text-align:center}
h1{margin:0;font-size:1.6rem;letter-spacing:.5px}
.sub{color:var(--sub);font-size:.9rem;margin-top:4px}
.pseudo-bar{display:flex;gap:8px;justify-content:center;align-items:center;margin:14px 0;flex-wrap:wrap}
.pseudo-bar input{background:var(--panel);border:1px solid #333759;color:var(--text);padding:8px 12px;border-radius:8px;font-size:.9rem;width:160px}
.score{font-weight:600;color:var(--legendaire)}
main{max-width:900px;margin:0 auto;padding:0 16px 60px}
.open-btn{display:block;margin:20px auto;padding:14px 32px;font-size:1.05rem;font-weight:700;border:none;border-radius:12px;background:linear-gradient(135deg,#ff5ea3,#ff9a3a);color:#111;cursor:pointer;box-shadow:0 6px 20px rgba(255,90,150,.35)}
.open-btn:active{transform:scale(.97)}
.open-btn:disabled{background:#31354d;color:var(--sub);box-shadow:none;cursor:not-allowed}
.pack-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
.pack-buttons>div{flex:1 1 200px;text-align:center}
.cooldown{margin-top:-14px;color:var(--sub);font-size:.8rem;min-height:1.2em}
.tabs{display:flex;justify-content:center;gap:8px;margin:18px 0;flex-wrap:wrap}
.tab-btn{background:none;border:1px solid #333759;color:var(--sub);padding:8px 18px;border-radius:20px;font-size:.9rem;cursor:pointer}
.tab-btn.active{background:var(--panel);color:var(--text);border-color:var(--legendaire)}
.card.locked{filter:grayscale(1) brightness(.5);opacity:.5!important;animation:none!important}
.card .count{position:absolute;bottom:8px;right:10px;font-size:.7rem;background:rgba(0,0,0,.4);padding:2px 7px;border-radius:20px}
.card .lvl{position:absolute;top:8px;right:10px;font-size:.65rem;background:rgba(0,0,0,.35);padding:2px 7px;border-radius:20px}
.card .stars{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:1px;line-height:1;font-size:.85rem;color:#ffd23a;text-shadow:0 1px 3px rgba(0,0,0,.6);text-align:right}
.card .stars .star{display:block;line-height:.9;transform-origin:center;filter:drop-shadow(0 0 3px rgba(255,210,58,.35))}
.card .stars .star.star5{font-size:1.45em;line-height:.72;filter:drop-shadow(0 0 7px rgba(255,190,30,.95));animation:star5Pulse 1.1s ease-in-out infinite alternate}
@keyframes star5Pulse{from{transform:scale(1)}to{transform:scale(1.14)}}

/* couleur de chaque rareté, réutilisée par le glow, les sparkles et les orbes */
.card.r-commune{--rc:#9aa0b8}
.card.r-rare{--rc:#3aa0ff}
.card.r-epique{--rc:#c65bff}
.card.r-legendaire{--rc:#ffb23a}

/* carte au niveau max : halo pulsant + sparkles dans la couleur de la rareté */
.card.maxed{animation:maxGlow 1.6s ease-in-out infinite alternate}
@keyframes maxGlow{
  from{box-shadow:0 0 10px 2px var(--rc)}
  to{box-shadow:0 0 28px 9px var(--rc)}
}
.sparkle{position:absolute;width:var(--s,10px);height:var(--s,10px);pointer-events:none;opacity:0;
  background:radial-gradient(circle,#fff 30%,var(--rc) 85%);
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
  animation:sparkle 1.8s ease-in-out infinite}
@keyframes sparkle{
  0%,100%{opacity:0;transform:scale(.2) rotate(0deg)}
  50%{opacity:1;transform:scale(1) rotate(45deg)}
}

.orb-field{position:fixed;inset:0;pointer-events:none;z-index:1002;overflow:hidden}
.orb{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--rc,#ffb52e) 30%,var(--rc,#ffb52e) 55%,transparent 75%);box-shadow:0 0 8px 3px var(--rc,#ffb52e),0 0 22px 8px var(--rc,#ffb52e);animation:orbFloat var(--orb-duration) ease-out forwards}
@keyframes orbFloat{
  0%{opacity:0;transform:translate3d(var(--sx),var(--sy),0) scale(.25)}
  12%{opacity:1}
  70%{opacity:.95}
  100%{opacity:0;transform:translate3d(var(--ex),var(--ey),0) scale(1.25)}
}
.orb-card-glow{animation:legendaryOrbGlow 1.1s ease-in-out infinite alternate}
@keyframes legendaryOrbGlow{from{box-shadow:0 0 22px rgba(255,178,58,.6)}to{box-shadow:0 0 48px 12px rgba(255,178,58,.9)}}

.lvlup-btn{position:absolute;bottom:6px;left:6px;right:6px;background:var(--legendaire);color:#111;border:none;border-radius:8px;padding:5px;font-size:.65rem;font-weight:700;cursor:pointer}
.pack-count{text-align:center;color:var(--sub);font-size:.85rem;margin-top:-8px}
.reveal{display:grid;grid-template-columns:repeat(auto-fill,130px);gap:14px;margin-top:24px;justify-content:center}
.card{position:relative;height:180px;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff;opacity:1;background-size:cover;background-position:center;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.card.r-commune{background-color:var(--commune);background-image:linear-gradient(160deg,#5c6178,var(--commune))}
.card.r-rare{background-color:var(--rare);background-image:linear-gradient(160deg,#1d5ea8,var(--rare))}
.card.r-epique{background-color:var(--epique);background-image:linear-gradient(160deg,#5a1a8a,var(--epique))}
.card.r-legendaire{background-color:var(--legendaire);background-image:linear-gradient(160deg,#a86a10,var(--legendaire));box-shadow:0 0 22px rgba(255,178,58,.6)}
.card.spawn{animation:pop .4s forwards}
.card.mystery{display:flex;align-items:center;justify-content:center;animation:pop .4s forwards, mysteryPulse .55s ease-in-out .4s infinite alternate}
.card.mystery .qmark{font-size:2.2rem;opacity:.85}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes mysteryPulse{from{box-shadow:0 0 6px 2px var(--glow-color, rgba(255,255,255,.4))}to{box-shadow:0 0 30px 12px var(--glow-color, rgba(255,255,255,.4))}}
.card.flip-in{animation:flipReveal .45s ease forwards}
@keyframes flipReveal{from{opacity:1;transform:rotateY(90deg) scale(.9)}to{opacity:1;transform:rotateY(0) scale(1)}}
.screen-flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:999;opacity:0;animation:flashPop .5s ease-out forwards}
@keyframes flashPop{0%{opacity:0}15%{opacity:.9}100%{opacity:0}}
.card .name{font-weight:700;font-size:1rem}
.card .title{font-size:.72rem;opacity:.85}
.card .pts{position:absolute;top:8px;right:10px;font-size:.75rem;background:rgba(0,0,0,.35);padding:2px 7px;border-radius:20px}
.card .rar{position:absolute;top:8px;left:10px;font-size:.65rem;text-transform:uppercase;letter-spacing:.5px;opacity:.9}
.stage-wrap{display:flex;justify-content:center;margin-top:28px;min-height:300px;align-items:center}
.stage-wrap .card{width:220px;height:290px}
.stage-wrap .card .name{font-size:1.2rem}
.stage-wrap .card .title{font-size:.85rem}
.stage-wrap .card .qmark{font-size:3rem}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:1000;padding:24px;cursor:pointer}
.modal-overlay .card{width:min(80vw,280px);aspect-ratio:220/290;height:auto;max-height:75vh;cursor:default}
.modal-overlay .card .name{font-size:1.3rem}
.modal-overlay .card .title{font-size:.9rem}
.modal-overlay .card .stars{font-size:1.1rem;top:12px;right:12px}
.modal-overlay .card .rar{font-size:.8rem}
.modal-close{position:absolute;top:16px;right:20px;color:#fff;font-size:1.8rem;background:none;border:none;cursor:pointer;line-height:1}
.recap-title{text-align:center;margin-top:24px;color:var(--sub);font-size:.9rem}
.recap-total{text-align:center;font-weight:700;color:var(--legendaire);margin-top:6px}
.section-title{margin:36px 0 10px;font-size:1.1rem;border-bottom:1px solid #333759;padding-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 6px;text-align:left}
tr:nth-child(even){background:rgba(255,255,255,.03)}
.rank{width:26px;color:var(--sub)}
.me{outline:1px solid var(--legendaire)}
.empty{color:var(--sub);font-style:italic;padding:10px 0}
footer{text-align:center;color:var(--sub);font-size:.75rem;padding:20px}
.account-hint{text-align:center;color:var(--sub);font-size:.78rem;margin-top:-8px;margin-bottom:6px}

/* lottery */
.lottery-box{max-width:360px;margin:20px auto;background:var(--panel);border-radius:16px;padding:20px;text-align:center}
.lottery-balance{color:var(--legendaire);font-weight:700;margin-bottom:14px}
#lotBet{width:140px;text-align:center;font-size:1.2rem;padding:8px;border-radius:8px;border:1px solid #333759;background:var(--bg);color:var(--text)}
.lot-quick{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.lot-chip{background:none;border:1px solid #333759;color:var(--text);border-radius:20px;padding:6px 14px;cursor:pointer}
.lot-pot{font-size:1.4rem;font-weight:800;color:var(--legendaire);margin:10px 0}
.lot-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.lot-actions .open-btn{margin:8px 0}
.lot-msg{min-height:1.4em;margin-top:14px;font-size:.95rem}
.lot-msg.bad{color:#ff6b6b}
</style>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.7.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.7.1/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
<header>
  <h1>Pack</h1>
  <div class="sub">Ouvre des packs, collectionne, grimpe au classement</div>
</header>

<div class="pseudo-bar">
  <input id="userInput" placeholder="Identifiant" maxlength="16" style="width:150px">
  <input id="passInput" type="password" placeholder="Mot de passe" style="width:150px">
  <button id="signupBtn" class="open-btn" style="margin:0;padding:8px 14px;font-size:.85rem">Créer mon compte</button>
  <button id="loginBtn" class="open-btn" style="margin:0;padding:8px 14px;font-size:.85rem;background:#31354d">Se connecter</button>
  <button id="logoutBtn" class="open-btn" style="margin:0;padding:8px 14px;font-size:.85rem;background:#5c1a2a;display:none">Déconnexion</button>
  <span class="score" id="myScore"></span>
</div>
<div class="account-hint" id="accountHint"></div>

<main>
  <div class="tabs">
    <button class="tab-btn active" id="tabPacks">Packs</button>
    <button class="tab-btn" id="tabCollection">Ma collection</button>
    <button class="tab-btn" id="tabLottery">Lottery</button>
  </div>

  <div id="view-packs">
  <div class="daily-box">
    <button class="open-btn" id="dailyBtn">🎁 Récompense du jour : +100 🪙</button>
    <div class="cooldown" id="dailyInfo" style="text-align:center"></div>
  </div>
  <div class="pack-buttons">
    <div>
      <button class="open-btn" id="openCommunBtn">Pack Commun (1 carte)</button>
      <div class="cooldown" id="cdCommun"></div>
    </div>
    <div>
      <button class="open-btn" id="openRareteBtn">Pack Rare (3 cartes)</button>
      <div class="cooldown" id="cdRarete"></div>
    </div>
  </div>
  <div class="pack-count" id="packCount"></div>
  <div class="reveal" id="reveal"></div>

  <div class="section-title">🏆 Classement</div>
  <div id="leaderboard"><div class="empty">Chargement…</div></div>
  </div>

  <div id="view-collection" style="display:none">
    <div class="section-title">📚 Ta collection (<span id="collStats"></span>)</div>
    <div class="reveal" id="collectionGrid"></div>
  </div>

  <div id="view-lottery" style="display:none">
    <div class="section-title">🎰 Casino</div>
    <div class="lottery-box">
      <div class="lottery-balance">Tes pièces : <b id="lotCoins">0</b> 🪙</div>

      <div id="lotSetup">
        <input id="lotBet" type="number" min="1" step="1" value="10" inputmode="numeric">
        <div class="lot-quick" id="lotQuick"></div>
        <button class="open-btn" id="lotPlay">Miser</button>
      </div>

      <div id="lotRound" style="display:none">
        <div class="lot-pot">Cagnotte : <b id="lotPot">0</b> 🪙</div>
        <div class="lot-actions">
          <button class="open-btn" id="lotDouble">Quitte ou double</button>
          <button class="open-btn" id="lotCash" style="background:#31354d;color:#fff">Encaisser</button>
        </div>
      </div>

      <div class="lot-msg" id="lotMsg"></div>
    </div>
  </div>
</main>

<footer>Made by Vic</footer>

<script>
// ---- Pool de cartes ----
const points = {commune:1, rare:5, epique:20, legendaire:50};
// pièces gagnées par carte tirée (indépendant des points du classement)
const coinRewards = {commune:1, rare:5, epique:25, legendaire:50};
const DAILY_REWARD = 100;   // pièces offertes une fois par jour
const MAX_DUPLICATE_COINS = 10;   // pièces données quand on tire une carte déjà au niveau max
const labels = {commune:"Commune", rare:"Rare", epique:"Épique", legendaire:"Légendaire"};

const rawPool = {
  commune: ["Firmin","Rayane","Cône Nir","Rafael","Louis","Vic","Edouard","Théo","Simon","Jules","Johanna", "Semoule Infinie"],
  rare: ["Giclette", "Poulet agressif","La Qualitat","Edoud","Paillasson", "Chasseur de grenouilles", "RunInLyon", "Marco Polo"],
  epique: ["1v1 Troupeau","Jesus", "Trio de choc","Pension","Minecraft","Euros en force"],
  legendaire: ["Mecs de st laurent","Gémal","Triple Identité"]
};
const IMAGES = {
  //--COMMUN--
  "Firmin": "./firmin.png",
  "Rayane": "./rayane.png",
  "Cône Nir": "./cone.png",
  "Rafael": "./rafael.png",
  "Louis": "./louis.png",
  "Vic": "./vic.png",
  "Edouard": "./edouard.png",
  "Théo": "./theo.png",
  "Simon": "./simon.png",
  "Jules": "./jules.png",
  "Johanna": "./johanna.png",
  "Semoule Infinie": "./semoule.png",
  //--RARE--
  "Giclette": "./giclette.png",
  "Poulet agressif": "./poulet.png",
  "La Qualitat": "./qualitat.png",
  "Edoud": "./edoud.png",
  "Paillasson": "./paillasson.png",
  "Chasseur de grenouilles": "./chasseur.png",
  "RunInLyon": "./run.png",
  "Marco Polo": "./marco.png",
  //--EPIQUE--
  "1v1 Troupeau": "./1v1.png",
  "Jesus": "./jesus.png",
  "Trio de choc": "./triodechoc.png",
  "Pension": "./pension.png",
  "Minecraft": "./minecraft.png",
  "Euros en force": "./euro.png",
  //--LEGENDAIRE--
  "Mecs de st laurent": "./stlaurent.png",
  "Gémal": "./gemal.png",
  "Triple Identité": "./triple.png"
};
const cards = [];
for(const [rarity, names] of Object.entries(rawPool)){
  for(const name of names){
    cards.push({name, title:"", rarity, image: IMAGES[name] || null});
  }
}

const weights = {commune:74, rare:20, epique:5, legendaire:1};
function drawCard(){
  const pool = [];
  for(const [r,w] of Object.entries(weights)){
    for(let i=0;i<w;i++) pool.push(r);
  }
  const r = pool[Math.floor(Math.random()*pool.length)];
  const candidates = cards.filter(c=>c.rarity===r);
  return candidates[Math.floor(Math.random()*candidates.length)];
}

// ---- Score : somme, pour chaque carte possédée, de (points de sa rareté) × (multiplicateur de son niveau) ----
const LEVEL_SCORE_MULT = {1:1, 2:2, 3:3, 4:5, 5:8};
function cardScore(rarity, level){ return points[rarity] * (LEVEL_SCORE_MULT[level] || 1); }
function computeScore(){
  let total = 0;
  for(const c of cards){
    const e = collection[c.name];
    if(e) total += cardScore(c.rarity, Number(e.level) || 1);
  }
  return total;
}

// ---- Etat local (chargé par compte, voir onAuthStateChanged) ----
let uid = null;
let pseudo = localStorage.getItem("pdp_pseudo") || "";
let pendingPseudo = "";
let myScore = 0;
let coins = 0;
let packsOpened = 0;
let collection = {};
let lastDaily = "";   // date (AAAA-MM-JJ) de la dernière récompense du jour récupérée
// seuil de copies + coût en pièces pour passer du niveau courant au suivant
const LEVEL_THRESHOLDS = {1:4, 2:8, 3:16, 4:32}; // niveau 5 = max, pas de seuil
const LEVEL_COSTS = {1:25, 2:50, 3:100, 4:300};

function localKey(){ return uid ? "pdp_account_"+uid : ""; }
function loadLocalCache(){
  if(!uid) return null;
  try{ return JSON.parse(localStorage.getItem(localKey())||"null"); }catch(e){ return null; }
}
async function saveProgress(){
  if(!uid) return false;

  const data = {
    uid,
    pseudo: String(pseudo || "").slice(0,16),
    score: Number(myScore) || 0,
    coins: Number(coins) || 0,
    packsOpened: Number(packsOpened) || 0,
    collection: migrateCollection(collection),
    lastDaily: String(lastDaily || "")
  };

  // Cache séparé par UID : il ne peut pas mélanger les comptes.
  localStorage.setItem(localKey(), JSON.stringify(data));

  try{
    // Un seul document par utilisateur : scores/{uid}.
    await firestore.collection("scores").doc(uid).set(
      {...data, updatedAt: firebase.firestore.FieldValue.serverTimestamp()},
      {merge:true}
    );
    return true;
  }catch(e){
    console.error("Erreur de sauvegarde Firestore:", e);
    setAccountStatus("Sauvegarde locale active ; vérifie les règles Firestore.", true);
    return false;
  }
}
function resetLocalState(){
  myScore = 0; coins = 0; packsOpened = 0; collection = {};
  lastDaily = "";
  lotteryPot = 0;
  updateScoreDisplay(); updatePackCount();
}

updateScoreDisplay();
updatePackCount();
function updateScoreDisplay(){
  document.getElementById("myScore").textContent = uid ? `${myScore} pts - ${coins} 🪙` : "";
  const lc = document.getElementById("lotCoins");
  if(lc) lc.textContent = coins;
}
function updatePackCount(){
  document.getElementById("packCount").textContent = packsOpened ? `${packsOpened} pack(s) ouvert(s)` : "";
}

// ---- Onglets ----
document.getElementById("tabPacks").addEventListener("click", ()=>switchTab("packs"));
document.getElementById("tabCollection").addEventListener("click", ()=>switchTab("collection"));
document.getElementById("tabLottery").addEventListener("click", ()=>switchTab("lottery"));
function switchTab(tab){
  if(tab !== "lottery" && lotteryPot > 0) lotteryCash();   // on n'abandonne pas une cagnotte en changeant d'onglet
  ["packs","collection","lottery"].forEach(t=>{
    document.getElementById("view-"+t).style.display = t===tab ? "" : "none";
    document.getElementById("tab"+t[0].toUpperCase()+t.slice(1)).classList.toggle("active", t===tab);
  });
  if(tab==="collection") renderCollection();
  if(tab==="lottery") updateLotteryUI();
}
function spawnOrbs(count=18, duration=1400){
  const field = document.createElement("div");
  field.className = "orb-field";
  document.body.appendChild(field);

  for(let i=0;i<count;i++){
    const orb = document.createElement("span");
    orb.className = "orb";

    const angle = Math.random() * Math.PI * 2;
    const radius = 70 + Math.random()*130;
    const sx = (Math.random()-.5) * 180;
    const sy = (Math.random()-.5) * 120;
    const ex = Math.cos(angle) * radius;
    const ey = Math.sin(angle) * radius - 90;

    orb.style.left = "50%";
    orb.style.top = "50%";
    orb.style.setProperty("--sx", `${sx}px`);
    orb.style.setProperty("--sy", `${sy}px`);
    orb.style.setProperty("--ex", `${ex}px`);
    orb.style.setProperty("--ey", `${ey}px`);
    orb.style.setProperty("--orb-duration", `${duration + Math.random()*500}ms`);
    orb.style.animationDelay = `${Math.random()*180}ms`;
    field.appendChild(orb);
  }

  setTimeout(()=>field.remove(), duration + 900);
}

function spawnOrbsAroundCard(card, count=24){
  const field = document.createElement("div");
  field.className = "orb-field";
  document.body.appendChild(field);
  // les orbes reprennent la couleur de la rareté de la carte
  field.style.setProperty("--rc", getComputedStyle(card).getPropertyValue("--rc"));

  const rect = card.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;

  for(let i=0;i<count;i++){
    const orb = document.createElement("span");
    orb.className = "orb";
    const angle = Math.random()*Math.PI*2;
    const radius = Math.max(rect.width, rect.height)*.48 + Math.random()*45;
    const sx = cx - 5;
    const sy = cy - 5;
    const ex = cx + Math.cos(angle)*radius - 5;
    const ey = cy + Math.sin(angle)*radius - 5;

    orb.style.left = `${sx}px`;
    orb.style.top = `${sy}px`;
    orb.style.setProperty("--sx","0px");
    orb.style.setProperty("--sy","0px");
    orb.style.setProperty("--ex",`${ex-sx}px`);
    orb.style.setProperty("--ey",`${ey-sy}px`);
    orb.style.setProperty("--orb-duration",`${1000 + Math.random()*650}ms`);
    orb.style.animationDelay = `${Math.random()*220}ms`;
    field.appendChild(orb);
  }

  setTimeout(()=>field.remove(), 1900);
}

function addSparkles(card, count=8){
  for(let i=0;i<count;i++){
    const s = document.createElement("span");
    s.className = "sparkle";
    s.style.left = (5 + Math.random()*85) + "%";
    s.style.top = (5 + Math.random()*85) + "%";
    s.style.setProperty("--s", (7 + Math.random()*9) + "px");
    s.style.animationDelay = (Math.random()*1.8) + "s";
    s.style.animationDuration = (1.4 + Math.random()*1.2) + "s";
    card.appendChild(s);
  }
}

function openCardZoom(c, entry){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const div = document.createElement("div");
  div.className = `card r-${c.rarity}`;
  if(c.image){
    div.style.backgroundImage = `linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.55)), url('${c.image}')`;
  }
  const level = entry.level;
  const threshold = LEVEL_THRESHOLDS[level];
  const progress = threshold ? `${entry.count}/${threshold}` : "MAX";
  const stars = Array.from({length: level}, (_,i)=>`<span class="star ${i===4 ? "star5" : ""}">★</span>`).join("");
  div.innerHTML = `<span class="rar">${labels[c.rarity]}</span><div class="stars">${stars}</div><div class="name">${c.name}</div><div class="title">${progress}</div>`;
  const closeBtn = document.createElement("button");
  closeBtn.className = "modal-close";
  closeBtn.textContent = "✕";
  overlay.appendChild(div);
  overlay.appendChild(closeBtn);
  overlay.addEventListener("click", (e)=>{
    if(e.target === overlay || e.target === closeBtn) overlay.remove();
  });
  document.body.appendChild(overlay);

  // Aperçu grand écran : sparkles + glow pour une carte niveau max, orbes pour niveau max ou légendaire.
  if(level >= 5){
    div.classList.add("maxed");
    addSparkles(div, 14);
  }else if(c.rarity === "legendaire"){
    div.classList.add("orb-card-glow");
  }
  if(level >= 5 || c.rarity === "legendaire"){
    spawnOrbsAroundCard(div, c.rarity === "legendaire" ? 30 : 22);
  }
}

function renderCollection(){
  const grid = document.getElementById("collectionGrid");
  grid.innerHTML = "";
  let owned = 0;
  cards.forEach(c=>{
    const entry = collection[c.name];
    if(entry) owned++;
    const div = document.createElement("div");
    div.className = `card r-${c.rarity}` + (!entry ? " locked" : "");
    div.style.animation = "none"; div.style.opacity = 1;
    if(entry && c.image){
      div.style.backgroundImage = `linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.55)), url('${c.image}')`;
    }
    if(!entry){
      div.innerHTML = `<span class="rar">${labels[c.rarity]}</span><div class="name">?</div>`;
    }else{
      const level = entry.level;
      const threshold = LEVEL_THRESHOLDS[level];
      const cost = LEVEL_COSTS[level];
      const canLevelUp = threshold && entry.count >= threshold;
      const isMax = !threshold;
      const progress = threshold ? `${entry.count}/${threshold}` : "MAX";
      const stars = Array.from({length: level}, (_,i)=>`<span class="star ${i===4 ? "star5" : ""}">★</span>`).join("");
      div.innerHTML = `<span class="rar">${labels[c.rarity]}</span><div class="stars">${stars}</div><div class="name">${c.name}</div><div class="title">${progress}</div>${canLevelUp?`<button class="lvlup-btn" data-name="${c.name}">⬆ Niv. ${level+1} — 🪙${cost}</button>`:""}`;
      div.style.cursor = "pointer";
      div.addEventListener("click", (e)=>{
        if(e.target.classList.contains("lvlup-btn")) return;
        openCardZoom(c, entry);
      });
      if(isMax){
        div.classList.add("maxed");
        div.style.animation = "";   // retire le "none" posé plus haut, sinon le halo ne joue pas
        addSparkles(div, 6);
      }
    }
    grid.appendChild(div);
  });
  document.getElementById("collStats").textContent = `${owned}/${cards.length}`;
  grid.querySelectorAll(".lvlup-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const name = btn.dataset.name;
      const entry = collection[name];
      const threshold = LEVEL_THRESHOLDS[entry.level];
      const cost = LEVEL_COSTS[entry.level];
      if(!threshold || entry.count < threshold) return;
      if(coins < cost){ alert(`Pas assez de pièces — il te faut 🪙${cost} (tu as 🪙${coins})`); return; }
      coins -= cost;
      entry.count -= threshold; // le surplus de copies est reporté au niveau suivant
      entry.level += 1;
      myScore = computeScore();
      saveProgress();
      updateScoreDisplay();
      renderCollection();
    });
  });
}

function migrateCollection(coll){
  const out = (coll && typeof coll === "object") ? {...coll} : {};
  for(const k in out){
    if(typeof out[k] === "number") out[k] = {count: out[k], level: 1};
    else if(!out[k] || typeof out[k] !== "object") delete out[k];
    else {
      out[k] = {
        count: Number.isFinite(Number(out[k].count)) ? Number(out[k].count) : 0,
        level: Number.isFinite(Number(out[k].level)) ? Number(out[k].level) : 1
      };
    }
  }
  return out;
}

auth.onAuthStateChanged(async (user)=>{

    // affichage instantané depuis le cache local propre à ce compte, le temps de récupérer Firestore
    const cached = loadLocalCache();
    if(cached){
      pseudo = cached.pseudo || pseudo;
      myScore = cached.score || 0;
      coins = cached.coins || 0;
      packsOpened = cached.packsOpened || 0;
      collection = migrateCollection(cached.collection);
      lastDaily = cached.lastDaily || "";
      myScore = computeScore();
    }
    document.getElementById("userInput").value = pseudo;
    updateScoreDisplay();
    updatePackCount();
    setAccountStatus("");

    // Firestore est la source distante de vérité pour CE UID.
    let remoteLoaded = false;
    try{
      const doc = await firestore.collection("scores").doc(uid).get();
      if(doc.exists){
        const d = doc.data() || {};
        pseudo = d.pseudo || pseudo;
        myScore = Number(d.score) || 0;
        coins = Number(d.coins) || 0;
        packsOpened = Number(d.packsOpened) || 0;
        collection = migrateCollection(d.collection);
        lastDaily = d.lastDaily || "";
        document.getElementById("userInput").value = pseudo;
        myScore = computeScore();
        remoteLoaded = true;
      }
    }catch(e){
      console.error("Lecture Firestore impossible:", e);
    }

    updateScoreDisplay();
    updatePackCount();
    // Ne jamais écraser Firestore avec un cache potentiellement ancien si la lecture distante a échoué.
    if(remoteLoaded || !cached) await saveProgress();
    if(document.getElementById("view-collection").style.display !== "none") renderCollection();
  }else{
    uid = null;
    resetLocalState();
    setLoggedInUI(false);
    setAccountStatus("Crée un compte (identifiant + mot de passe) pour sauvegarder ta progression et apparaître au classement.");

// ---- Cooldowns ----
let packBusy = false;
const PACKS = {
  commun:  {cooldownMs: 30*1000, count:1, label:"Pack Commun",  btnId:"openCommunBtn", cdId:"cdCommun"},
  rarete:  {cooldownMs: 3*60*1000, count:3, label:"Pack Rareté",  btnId:"openRareteBtn", cdId:"cdRarete"}
};
function cooldownKey(key){
  return uid ? `pdp_last_${uid}_${key}` : `pdp_last_${key}`;
}
function lastOpen(key){ return parseInt(localStorage.getItem(cooldownKey(key))||"0",10); }
function setLastOpen(key){ localStorage.setItem(cooldownKey(key), Date.now()); }
function remainingMs(key){
  const elapsed = Date.now() - lastOpen(key);
  return Math.max(0, PACKS[key].cooldownMs - elapsed);
}
function fmt(ms){
  const s = Math.ceil(ms/1000);
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${m}:${sec.toString().padStart(2,"0")}`;
}
function refreshCooldowns(){
  for(const key of Object.keys(PACKS)){
    const p = PACKS[key];
    const rem = remainingMs(key);
    const btn = document.getElementById(p.btnId);
    const cd = document.getElementById(p.cdId);
    if(rem > 0 || packBusy){
      btn.disabled = true;
      cd.textContent = rem > 0 ? "Disponible dans " + fmt(rem) : "";
    }else{
      btn.disabled = false;
      cd.textContent = "";
    }
  }
  refreshDaily();
}
setInterval(refreshCooldowns, 1000);
refreshCooldowns();

const GLOW_COLORS = {commune:"#9aa0b8", rare:"#3aa0ff", epique:"#c65bff", legendaire:"#ffb23a"};
const SUSPENSE_MS = {commune:800, rare:1400, epique:2100, legendaire:3000};

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

async function openPack(key){
  if(!uid){ document.getElementById("userInput").focus(); setAccountStatus("Connecte-toi ou crée un compte pour ouvrir un pack.", true); return; }
  if(remainingMs(key) > 0 || packBusy) return;
  packBusy = true;
  document.getElementById("openCommunBtn").disabled = true;
  document.getElementById("openRareteBtn").disabled = true;
  const p = PACKS[key];
  const reveal = document.getElementById("reveal");
  reveal.className = "stage-wrap";
  reveal.innerHTML = "";
  setLastOpen(key);

  const drawn = [];
  const convertedFlags = [];   // true si la carte tirée était déjà au niveau max
  const gainList = [];          // points gagnés par carte (carte nouvelle uniquement)
  let gained = 0;
  let gainedCoins = 0;
  for(let i=0;i<p.count;i++){
    const c = drawCard();
    drawn.push(c);

    // Phase 1 : carte mystère au premier plan, pulsation colorée selon la rareté
    reveal.innerHTML = "";
    const div = document.createElement("div");
    div.className = `card r-${c.rarity} mystery spawn`;
    div.style.setProperty("--glow-color", GLOW_COLORS[c.rarity]);
    div.innerHTML = `<span class="qmark">?</span>`;
    reveal.appendChild(div);

    await sleep(SUSPENSE_MS[c.rarity]);

    // Phase 2 : révélation de cette carte, seule au premier plan
    gainedCoins += coinRewards[c.rarity];
    div.classList.remove("mystery","spawn");
    div.classList.add("flip-in");
    const entryNow = collection[c.name];
    const dupMax = !!entryNow && !LEVEL_THRESHOLDS[entryNow.level];   // déjà au niveau max
    convertedFlags.push(dupMax);
    const scoreGain = entryNow ? 0 : cardScore(c.rarity, 1);   // une carte déjà possédée ne rapporte pas de points
    gained += scoreGain;
    gainList.push(scoreGain);
    if(c.image){
      div.style.backgroundImage = `linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.55)), url('${c.image}')`;
    }
    div.innerHTML = `<span class="rar">${labels[c.rarity]}</span>${scoreGain ? `<span class="pts">+${scoreGain}</span>` : ""}<div class="name">${c.name}</div><div class="title">${dupMax ? "Niveau max → " + MAX_DUPLICATE_COINS*coinRewards[c.rarity] + " 🪙" : c.title}</div>`;
    if(c.rarity === "legendaire"){
      const flash = document.createElement("div");
      flash.className = "screen-flash";
      document.body.appendChild(flash);
      setTimeout(()=>flash.remove(), 550);

      // Effet d'orbes à l'ouverture d'une légendaire.
      div.classList.add("orb-card-glow");
      spawnOrbs(34, 1700);
      setTimeout(()=>div.classList.remove("orb-card-glow"), 1800);
    }
    if(dupMax){
      gainedCoins = MAX_DUPLICATE_COINS*coinRewards[c.rarity];   // pas de copie ajoutée : 15 pièces à la place
    }else{
      collection[c.name] = collection[c.name] || {count:0, level:1};
      collection[c.name].count += 1;
    }

    if(i < p.count-1) await sleep(900); // temps pour voir la carte avant la suivante
  }

  // Bilan du pack : toutes les cartes obtenues, résumées
  await sleep(600);
  reveal.className = "reveal";
  reveal.innerHTML = "";
  drawn.forEach((c,i)=>{
    const div = document.createElement("div");
    div.className = `card r-${c.rarity}`;
    if(c.image){
      div.style.backgroundImage = `linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.55)), url('${c.image}')`;
    }
    div.innerHTML = `<span class="rar">${labels[c.rarity]}</span>${gainList[i] ? `<span class="pts">+${gainList[i]}</span>` : ""}<div class="name">${c.name}</div><div class="title">${convertedFlags[i] ? "Niveau max → " + MAX_DUPLICATE_COINS*coinRewards[c.rarity] + " 🪙" : c.title}</div>`;
    reveal.appendChild(div);
  });
  const recapTitle = document.createElement("div");
  recapTitle.className = "recap-title";
  recapTitle.textContent = `Bilan du pack — ${p.count} carte(s)`;
  reveal.parentNode.insertBefore(recapTitle, reveal);
  const recapTotal = document.createElement("div");
  recapTotal.className = "recap-total";
  recapTotal.textContent = `🪙${gainedCoins}`;
  reveal.parentNode.insertBefore(recapTotal, reveal);
  // nettoyage des anciens bilans si un pack a déjà été ouvert avant
  document.querySelectorAll(".recap-title, .recap-total").forEach(el=>{
    if(el !== recapTitle && el !== recapTotal) el.remove();
  });

  myScore = computeScore();
  coins += gainedCoins;
  packsOpened += 1;
  saveProgress();
  updateScoreDisplay();
  updatePackCount();
  refreshCooldowns();
  packBusy = false;
}
document.getElementById("openCommunBtn").addEventListener("click", ()=>openPack("commun"));
document.getElementById("openRareteBtn").addEventListener("click", ()=>openPack("rarete"));

// ---- Récompense du jour ----
function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtHMS(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}
function refreshDaily(){
  const btn = document.getElementById("dailyBtn");
  const info = document.getElementById("dailyInfo");
  const claimed = !!uid && lastDaily === todayStr();
  btn.disabled = claimed;
  if(claimed){
    const now = new Date();
    const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1);
    info.textContent = "Déjà récupérée — prochaine dans " + fmtHMS(midnight - now);
  }else{
    info.textContent = "";
  }
}
function claimDaily(){
  if(!uid){ setAccountStatus("Connecte-toi pour récupérer ta récompense du jour.", true); return; }
  if(lastDaily === todayStr()) return;
  lastDaily = todayStr();
  coins += DAILY_REWARD;
  saveProgress();
  updateScoreDisplay();
  refreshDaily();
}
document.getElementById("dailyBtn").addEventListener("click", claimDaily);

// ---- Lottery : mise, quitte ou double ----
const LOTTERY_START_CHANCE = 0.45;   // première mise
const LOTTERY_DOUBLE_CHANCE = 0.55;  // quitte ou double
let lotteryPot = 0;                  // cagnotte en jeu (déjà retirée de tes pièces)

function lotteryMsg(text, bad){
  const el = document.getElementById("lotMsg");
  el.textContent = text;
  el.className = "lot-msg" + (bad ? " bad" : "");
}
// mises rapides : moins de 500 pièces → 1/10/50/100, à partir de 500 → 10/100/500/1000
function renderQuickBets(){
  const bets = coins < 500 ? [1,10,50,100] : [10,100,500,1000];
  document.getElementById("lotQuick").innerHTML =
    bets.map(b=>`<button class="lot-chip" data-bet="${b}">${b}</button>`).join("") +
    `<button class="lot-chip" data-bet="max">Tout</button>`;
}
function updateLotteryUI(){
  renderQuickBets();
  document.getElementById("lotCoins").textContent = coins;
  document.getElementById("lotPot").textContent = lotteryPot;
  const inRound = lotteryPot > 0;
  document.getElementById("lotSetup").style.display = inRound ? "none" : "";
  document.getElementById("lotRound").style.display = inRound ? "" : "none";
}
function lotteryStart(){
  if(!uid){ setAccountStatus("Connecte-toi pour jouer à la lottery.", true); return; }
  if(lotteryPot > 0) return;
  const bet = Math.floor(Number(document.getElementById("lotBet").value));
  if(!(bet >= 1)){ lotteryMsg("Mise invalide.", true); return; }
  if(bet > coins){ lotteryMsg(`Pas assez de pièces (tu as ${coins} 🪙).`, true); return; }
  coins -= bet;
  if(Math.random() < LOTTERY_START_CHANCE){
    lotteryPot = bet * 2;
    lotteryMsg(`Gagné ! La cagnotte passe à ${lotteryPot} 🪙. Encaisse, ou tente le quitte ou double.`);
  }else{
    lotteryMsg(`Perdu... −${bet} 🪙.`, true);
  }
  saveProgress(); updateScoreDisplay(); updateLotteryUI();
}
function lotteryDouble(){
  if(lotteryPot <= 0) return;
  if(Math.random() < LOTTERY_DOUBLE_CHANCE){
    lotteryPot *= 2;
    lotteryMsg(`Double ! La cagnotte monte à ${lotteryPot} 🪙.`);
  }else{
    lotteryMsg(`Perdu... la cagnotte de ${lotteryPot} 🪙 part en fumée.`, true);
    lotteryPot = 0;
  }
  updateLotteryUI();
}
function lotteryCash(){
  if(lotteryPot <= 0) return;
  coins += lotteryPot;
  lotteryMsg(`Encaissé : +${lotteryPot} 🪙 !`);
  lotteryPot = 0;
  saveProgress(); updateScoreDisplay(); updateLotteryUI();
}
document.getElementById("lotPlay").addEventListener("click", lotteryStart);
document.getElementById("lotDouble").addEventListener("click", lotteryDouble);
document.getElementById("lotCash").addEventListener("click", lotteryCash);
document.getElementById("lotQuick").addEventListener("click", e=>{
  const b = e.target.closest(".lot-chip");
  if(!b) return;
  document.getElementById("lotBet").value = b.dataset.bet === "max" ? coins : Number(b.dataset.bet);
});

window.addEventListener("beforeunload", e=>{

});

// ---- Leaderboard partagé (Firestore) ----
let unsubscribeLeaderboard = null;
function startLeaderboard(){
  if(unsubscribeLeaderboard){ unsubscribeLeaderboard(); unsubscribeLeaderboard = null; }
  unsubscribeLeaderboard = firestore.collection("scores")
    .orderBy("score","desc").limit(15)
    .onSnapshot(snap=>{
      renderLeaderboard(snap.docs.map(d=>d.data()));
    }, err=>{
      console.error("Classement:", err);
      document.getElementById("leaderboard").innerHTML =
        '<div class="empty">Classement indisponible (' + (err.code || "erreur") + ').</div>';
    });
}
startLeaderboard();

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function renderLeaderboard(docs){
  const el = document.getElementById("leaderboard");
  if(!docs || !docs.length){
    el.innerHTML = '<div class="empty">Aucun score pour l\'instant — ouvre le premier pack !</div>';
    return;
  }

  const rows = docs
    .map(d => d.data || d)
    .sort((a,b)=>(Number(b.score)||0)-(Number(a.score)||0))
    .slice(0,15);

  const total = cards.length;
  const MAX_LEVEL = Object.keys(LEVEL_THRESHOLDS).length + 1; // 5
  let html = "<table><tr><th class='rank'>#</th><th>Pseudo</th><th>Score</th><th>Découvertes</th><th>★ Max</th><th>Packs</th></tr>";
  rows.forEach((r,i)=>{
    const mine = r.uid && r.uid === uid ? "me" : "";
    // on ne compte que les cartes qui existent encore dans le jeu
    const owned = cards.filter(c => r.collection && r.collection[c.name]);
    const found = owned.length;
    const maxed = owned.filter(c => Number(r.collection[c.name].level) >= MAX_LEVEL).length;
    html += `<tr class="${mine}">
      <td class="rank">${i+1}</td>
      <td>${escapeHtml(r.pseudo || "Joueur")}</td>
      <td>${Number(r.score)||0}</td>
      <td>${found}/${total}</td>
      <td>${maxed}/${total}</td>
      <td>${Number(r.packsOpened)||0}</td>
    </tr>`;
  });
  html += "</table>";
  el.innerHTML = html;
}
